    <text x="88" y="190" fill="#c9cfe0" font-size="21">Embedded with business teams. From messy CRM data to BI and AI agents in production.</text>
    <g font-size="15" fill="#2ec5a5">
      <text x="88" y="232">Salesforce · Dynamics 365 · SQL · Python · Power BI · Claude Code · MCP · Agents</text>
    </g>
  </g>
  <g opacity="0.18" fill="none" stroke="#7c5cff" stroke-width="2">
    <circle cx="1090" cy="70" r="46"/>
    <circle cx="1090" cy="70" r="84"/>
    <circle cx="1090" cy="70" r="122"/>
  </g>
</svg>
